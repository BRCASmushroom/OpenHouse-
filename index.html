<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程活動現場候位系統</title>
    <!-- 引入 Tailwind CSS 確保排版美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- 主容器 -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden mb-6">
        
        <!-- 頂部標題列 -->
        <div class="bg-blue-600 text-white p-5 text-center relative">
            <h1 class="text-xl font-bold">🎯 課程活動現場候位系統</h1>
            <p id="system-status" class="text-xs text-blue-100 mt-1">狀態：開放候位中 (Google 試算表同步版)</p>
            <!-- 切換工作人員後台按鈕 -->
            <button onclick="toggleView()" class="absolute top-4 right-4 bg-blue-700 hover:bg-blue-800 text-white text-xs px-2.5 py-1.5 rounded transition">
                <span id="toggle-text">工作人員後台</span>
            </button>
        </div>

        <!-- ================= 民眾候位視圖 ================= -->
        <div id="client-view" class="p-6 space-y-6">
            
            <!-- 候位規則說明 -->
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 text-xs text-blue-900 space-y-1.5 shadow-sm">
                <p class="font-bold text-blue-950 mb-1">📋 候位規則說明：</p>
                <p>• 點選下方「登記候位」取得您的專屬候位序號。</p>
                <p>• 頁面將隨時更新目前已順利進入課程的序號進度。</p>
                <p>• 活動開始時，系統將依棄權名額自動發送遞補通知。</p>
                <p>• 收到通知者請於 <strong>5 分鐘內</strong> 至櫃檯報到，逾時視同棄權。</p>
                <p>• 若需取消，可隨時點選「放棄候位」退回初始畫面。</p>
            </div>

            <!-- 目前叫號進度區塊 -->
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-5 text-center shadow-inner">
                <p class="text-xs text-gray-500 font-semibold mb-1">目前已順利進入課程之最後序號</p>
                <div id="current-admitted" class="text-3xl font-extrabold text-blue-600 my-1">尚未開始</div>
                <hr class="my-3 border-gray-200">
                <p class="text-xs text-gray-500 mb-1">您的候位狀態</p>
                <div id="my-status-box" class="my-2">
                    <span class="inline-block px-3 py-1 bg-gray-200 text-gray-700 rounded-full text-sm font-medium">尚未登記</span>
                </div>
            </div>

            <!-- 互動按鈕區塊 -->
            <div id="action-buttons" class="space-y-3">
                <button onclick="registerQueue()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                    登記候位
                </button>
            </div>
        </div>

        <!-- ================= 工作人員登入視圖 ================= -->
        <div id="admin-login-view" class="p-6 space-y-4 hidden-section">
            <div class="text-center py-4">
                <h2 class="text-lg font-bold text-gray-800">工作人員身分驗證</h2>
                <p class="text-xs text-gray-500 mt-1">請輸入後台管理密碼以繼續</p>
            </div>
            <div>
                <input type="password" id="admin-password-input" placeholder="請輸入密碼" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3">
                <button onclick="verifyAdminPassword()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2.5 px-4 rounded-lg shadow transition">
                    登入後台
                </button>
            </div>
        </div>

        <!-- ================= 工作人員控制後台視圖 ================= -->
        <div id="admin-view" class="p-6 space-y-6 hidden-section">
            <div class="bg-orange-50 border border-orange-200 rounded-xl p-4 text-center">
                <p class="text-xs text-orange-600 font-bold">目前系統即時統計</p>
                <div class="flex justify-around my-2">
                    <div>
                        <p class="text-xs text-gray-500">總登記人數</p>
                        <p id="stat-total" class="text-xl font-bold text-gray-800">0</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500">已通知人數</p>
                        <p id="stat-notified" class="text-xl font-bold text-orange-600">0</p>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <label class="block text-xs font-bold text-gray-700">釋出空位名額：</label>
                <input type="number" id="available-slots-input" value="1" min="1" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <button onclick="processQueue()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                    📢 確認並發送遞補通知
                </button>
            </div>

            <div class="pt-2 border-t">
                <button onclick="adminLogout()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition text-xs">
                    🔒 登出後台
                </button>
            </div>
        </div>

    </div>

    <!-- Google 試算表同步邏輯控制 -->
    <script>
        // 🚨 請將下方 '您的AppsScript網址' 換成您真實的網頁應用程式網址
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzMu-G3ULicu7FUOyax4LdSRA9Y0WGTGueG3mqadSLre2s2PTWYUIGUby9hMfayoU/exec'; 

        let cachedData = {
            totalRegistered: 0,
            notifiedCount: 0,
            admittedNumber: 0
        };

        let isFetching = false;

        // 從 Google 試算表抓取最新資料
        async function fetchCloudData() {
            if (isFetching) return;
            isFetching = true;
            try {
                let response = await fetch(`${SCRIPT_URL}?action=get`, { cache: 'no-store' });
                if (response.ok) {
                    let json = await response.json();
                    if (json && typeof json.totalRegistered === 'number') {
                        cachedData = json;
                        updateUI();
                    }
                }
            } catch (e) {
                console.error("讀取雲端資料失敗", e);
            } finally {
                isFetching = false;
            }
        }

        function getMyNumber() {
            return localStorage.getItem('openhouse_my_number') ? parseInt(localStorage.getItem('openhouse_my_number')) : null;
        }

        function setMyNumber(num) {
            if (num === null) {
                localStorage.removeItem('openhouse_my_number');
            } else {
                localStorage.setItem('openhouse_my_number', num);
            }
        }

        // 登記候位（含防連點與錯誤自動解鎖按鈕機制）
        async function registerQueue() {
            if (getMyNumber() !== null) {
                alert(`您已經登記過了！您的序號為 NO. ${getMyNumber()}`);
                return;
            }

            const actionButtons = document.getElementById('action-buttons');
            actionButtons.innerHTML = `<button disabled class="w-full bg-gray-400 text-white font-bold py-3 px-4 rounded-lg shadow">登記中，請稍候...</button>`;

            try {
                let response = await fetch(`${SCRIPT_URL}?action=register`);
                if (!response.ok) {
                    throw new Error("伺服器回應異常");
                }
                
                let result = await response.json();
                if (result && result.success) {
                    setMyNumber(result.myNumber);
                    await fetchCloudData();
                    alert(`登記成功！您的候位序號為：NO. ${result.myNumber}`);
                } else {
                    alert("登記失敗，請再試一次。");
                    resetRegisterButton();
                }
            } catch (e) {
                console.error("登記錯誤：", e);
                alert("無法連線至後台，請檢查 Google 網址是否正確或權限是否設為「所有人」。");
                resetRegisterButton();
            }
        }

        // 手動解鎖按鈕的輔助函數
        function resetRegisterButton() {
            const actionButtons = document.getElementById('action-buttons');
            actionButtons.innerHTML = `
                <button onclick="registerQueue()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                    登記候位
                </button>
            `;
        }

        // 放棄候位
        async function cancelQueue() {
            if (confirm("確定要放棄候位嗎？放棄後將退回初始畫面。")) {
                let myNum = getMyNumber();
                if (myNum !== null) {
                    try {
                        await fetch(`${SCRIPT_URL}?action=cancel&num=${myNum}`);
                    } catch (e) {
                        console.error("同步放棄狀態失敗", e);
                    }
                }
                setMyNumber(null);
                await fetchCloudData();
                alert("已成功放棄候位。");
                updateUI();
            }
        }

        // 後台處理：發送遞補通知
        async function processQueue() {
            const slots = parseInt(document.getElementById('available-slots-input').value);
            
            if (isNaN(slots) || slots <= 0) {
                alert("請輸入有效的名額數量！");
                return;
            }

            try {
                let response = await fetch(`${SCRIPT_URL}?action=notify&slots=${slots}`);
                let result = await response.json();
                if (result.success) {
                    await fetchCloudData();
                    alert(`已成功發送遞補通知！目前通知至序號 NO. ${result.notifiedCount}`);
                }
            } catch (e) {
                alert("發送通知失敗，請稍後再試。");
            }
        }

        // 驗證後台密碼
        function verifyAdminPassword() {
            const pwd = document.getElementById('admin-password-input').value;
            if (pwd === "B301amanita") {
                localStorage.setItem('openhouse_is_admin_logged', 'true');
                document.getElementById('admin-login-view').classList.add('hidden-section');
                document.getElementById('admin-view').classList.remove('hidden-section');
                document.getElementById('system-status').textContent = "狀態：工作人員後台控制中";
                document.getElementById('system-status').className = "text-xs text-orange-200 mt-1";
                document.getElementById('admin-password-input').value = "";
            } else {
                alert("密碼錯誤，請重新輸入！");
            }
        }

        // 登出後台
        function adminLogout() {
            localStorage.removeItem('openhouse_is_admin_logged');
            toggleView();
            alert("已成功登出後台！");
        }

        // 更新介面
        function updateUI() {
            let myNum = getMyNumber();

            const admittedEl = document.getElementById('current-admitted');
            admittedEl.textContent = cachedData.notifiedCount > 0 ? `NO. ${cachedData.notifiedCount}` : "尚未開始";

            const myStatusBox = document.getElementById('my-status-box');
            const actionButtons = document.getElementById('action-buttons');

            if (myNum === null) {
                myStatusBox.innerHTML = `<span class="inline-block px-3 py-1 bg-gray-200 text-gray-700 rounded-full text-sm font-medium">尚未登記</span>`;
                
                if (!actionButtons.innerHTML.includes('登記中')) {
                    resetRegisterButton();
                }
            } else {
                let isNotified = myNum <= cachedData.notifiedCount;
                
                if (isNotified) {
                    myStatusBox.innerHTML = `
                        <div class="bg-red-50 border border-red-300 p-3 rounded-lg text-red-800 animate-pulse">
                            <p class="font-bold text-base">🚨 系統通知：輪到您遞補了！</p>
                            <p class="text-xs mt-1">您的序號：<span class="font-bold">NO. ${myNum}</span></p>
                            <p class="text-xs text-red-600 mt-1 font-semibold">請於活動開始後 5 分鐘內至櫃檯報到，逾時視同棄權！</p>
                        </div>
                    `;
                } else {
                    let aheadCount = Math.max(0, myNum - cachedData.notifiedCount - 1);
                    myStatusBox.innerHTML = `
                        <div class="bg-green-50 border border-green-200 p-3 rounded-lg text-green-800">
                            <p class="text-sm">您的候位序號</p>
                            <p class="text-2xl font-bold">NO. ${myNum}</p>
                            <p class="text-xs text-green-600 mt-1">目前叫號進度：NO. ${cachedData.notifiedCount} (前方約有 ${aheadCount} 人)</p>
                        </div>
                    `;
                }

                actionButtons.innerHTML = `
                    <button onclick="cancelQueue()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg shadow transition text-sm">
                        放棄候位
                    </button>
                `;
            }

            document.getElementById('stat-total').textContent = cachedData.totalRegistered;
            document.getElementById('stat-notified').textContent = cachedData.notifiedCount;
        }

        // 切換視圖
        let isViewingAdmin = false;
        function toggleView() {
            isViewingAdmin = !isViewingAdmin;
            const clientView = document.getElementById('client-view');
            const adminLoginView = document.getElementById('admin-login-view');
            const adminView = document.getElementById('admin-view');
            const toggleText = document.getElementById('toggle-text');
            const systemStatus = document.getElementById('system-status');
            const isAdminLogged = localStorage.getItem('openhouse_is_admin_logged') === 'true';

            if (isViewingAdmin) {
                clientView.classList.add('hidden-section');
                if (isAdminLogged) {
                    adminLoginView.classList.add('hidden-section');
                    adminView.classList.remove('hidden-section');
                } else {
                    adminView.classList.add('hidden-section');
                    adminLoginView.classList.remove('hidden-section');
                }
                toggleText.textContent = "民眾候位首頁";
                systemStatus.textContent = "狀態：工作人員後台控制中";
                systemStatus.className = "text-xs text-orange-200 mt-1";
            } else {
                adminLoginView.classList.add('hidden-section');
                adminView.classList.add('hidden-section');
                clientView.classList.remove('hidden-section');
                toggleText.textContent = "工作人員後台";
                systemStatus.textContent = "狀態：開放候位中";
                systemStatus.className = "text-xs text-blue-100 mt-1";
            }
        }

        // 自動同步機制：每 3 秒自動向 Google 試算表抓取最新資料
        setInterval(() => {
            fetchCloudData();
        }, 3000);

        // 初始化載入
        fetchCloudData();
    </script>
</body>
</html>
